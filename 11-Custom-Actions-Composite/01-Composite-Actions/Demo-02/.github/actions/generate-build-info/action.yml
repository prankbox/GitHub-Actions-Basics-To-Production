name: Generate Build Information
description: Generates build metadata using GitHub Context.

inputs:
  application-name:
    description: Name of the application.
    required: true

  environment:
    description: Deployment environment.
    required: true

outputs:
  build-info-path:
    description: Path to the generated build information file.
    value: output/build-info.txt

runs:
  using: composite

  steps:
    - name: Generate Build Information
      shell: bash
      env:
        APPLICATION_NAME: ${{ inputs.application-name }}
        DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        REPOSITORY: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        COMMIT_SHA: ${{ github.sha }}
        RUN_NUMBER: ${{ github.run_number }}
        WORKFLOW_NAME: ${{ github.workflow }}
        TRIGGERING_ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail

        mkdir -p output

        BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        printf '%s\n' \
          "Application : ${APPLICATION_NAME}" \
          "Environment : ${DEPLOYMENT_ENVIRONMENT}" \
          "Repository  : ${REPOSITORY}" \
          "Branch      : ${BRANCH}" \
          "Commit SHA  : ${COMMIT_SHA}" \
          "Run Number  : ${RUN_NUMBER}" \
          "Workflow    : ${WORKFLOW_NAME}" \
          "Triggered By: ${TRIGGERING_ACTOR}" \
          "Build Time  : ${BUILD_TIME}" \
          > output/build-info.txt

        echo "======================================"
        echo "Build Information"
        echo "======================================"
        cat output/build-info.txt
