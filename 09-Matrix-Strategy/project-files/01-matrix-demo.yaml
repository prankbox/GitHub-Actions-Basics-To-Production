name: 01 - Matrix Strategy Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-job:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Matrix Information
        run: |
          echo "Runner OS: ${{ runner.os }}"
          echo "Matrix Python Version: ${{ matrix.python-version }}"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Application
        run: |
          set -euo pipefail
          python app.py &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for attempt in {1..10}; do
            if curl --fail-with-body --silent --show-error http://127.0.0.1:5000/health; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "Application did not become healthy in time." >&2
              exit 1
            fi
            sleep 2
          done

          echo "Application executed successfully."

          echo "Matrix Python Version : ${{ matrix.python-version }}"
          python --version

          kill "$APP_PID"
          trap - EXIT
